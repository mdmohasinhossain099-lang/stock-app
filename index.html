<!DOCTYPE html>
<html>
<head>
  <title>Stock Manager</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }

    .box {
      background: white;
      padding: 20px;
      margin: 20px;
      width: calc(100% - 40px);
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input, button {
      padding: 10px;
      margin: 5px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    table {
      width: 100%;
      margin-top: 10px;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }

    th {
      background: #007bff;
      color: white;
    }
  </style>
</head>

<body>

<div class="box" id="loginBox">
  <h2>Login</h2>
  <input id="username" placeholder="Username">
  <input id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div class="box" id="app" style="display:none;">
  <h2>Stock Manager</h2>

  <input id="item" placeholder="Parts name">
  <input id="qty" type="number" placeholder="Quantity">
  <input id="loc" placeholder="Location">
  <input id="quality" placeholder="Quality">

  <br>

  <button onclick="add()">Add</button>
  <button onclick="minus()">Minus</button>

  <h3>Stock</h3>
  <table id="stockTable"></table>

  <h3>History</h3>
  <table id="historyTable"></table>

  <div id="adminPanel" style="display:none;">
    <h3>Admin Panel</h3>

    <input id="newUser" placeholder="New User">
    <input id="newPass" placeholder="Password">
    <button onclick="addUser()">Add User</button>

    <br>

    <input id="changePass" placeholder="New Admin Password">
    <button onclick="changeAdminPass()">Change Admin Password</button>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, collection,
  addDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGBmkM66osUUrIzt8KsgU7u9YiuHPLPPw",
  authDomain: "stockapp-3d9f9.firebaseapp.com",
  projectId: "stockapp-3d9f9"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);

let currentUser = "";

// LOGIN
window.login = async function(){
  let u = username.value;
  let p = password.value;

  let snap = await getDoc(doc(db,"users",u));

  if(snap.exists() && snap.data().pass == p){
    currentUser = u;
    loginBox.style.display="none";
    app.style.display="block";

    if(u=="mohasin"){
      adminPanel.style.display="block";
    }

  } else {
    alert("Wrong login");
  }
};

// ADD
window.add = async function(){

  let item = document.getElementById("item").value;
  let safeItem = item.replaceAll("/", "_");

  let qty = parseInt(document.getElementById("qty").value);
  let loc = document.getElementById("loc").value;
  let quality = document.getElementById("quality").value;

  if(isNaN(qty)){
    alert("Number only");
    return;
  }

  let ref = doc(db,"stock",safeItem);
  let snap = await getDoc(ref);

  let current = snap.exists() ? snap.data().qty : 0;

  await setDoc(ref,{
    name:item,
    qty:current + qty,
    loc,
    quality
  });

  await addDoc(collection(db,"history"),{
    item,qty,type:"add",user:currentUser
  });
};

// MINUS
window.minus = async function(){

  let item = document.getElementById("item").value;
  let safeItem = item.replaceAll("/", "_");

  let qty = parseInt(document.getElementById("qty").value);
  let loc = document.getElementById("loc").value;
  let quality = document.getElementById("quality").value;

  let ref = doc(db,"stock",safeItem);
  let snap = await getDoc(ref);

  let current = snap.exists() ? snap.data().qty : 0;

  await setDoc(ref,{
    name:item,
    qty:current - qty,
    loc,
    quality
  });

  await addDoc(collection(db,"history"),{
    item,qty,type:"minus",user:currentUser
  });
};

// ADMIN PASS CHANGE
window.changeAdminPass = async function(){
  let newPass = document.getElementById("changePass").value;

  await setDoc(doc(db,"users","mohasin"),{
    pass:newPass
  });

  alert("Password changed!");
};

// STOCK VIEW
onSnapshot(collection(db,"stock"),snap=>{
  let out="<tr><th>Name</th><th>Qty</th><th>Loc</th><th>Quality</th></tr>";
  snap.forEach(doc=>{
    let d=doc.data();
    out+=`<tr><td>${d.name}</td><td>${d.qty}</td><td>${d.loc}</td><td>${d.quality}</td></tr>`;
  });
  stockTable.innerHTML=out;
});

// HISTORY
onSnapshot(collection(db,"history"),snap=>{
  let out="<tr><th>Item</th><th>Action</th><th>User</th></tr>";
  snap.forEach(doc=>{
    let d=doc.data();
    out+=`<tr><td>${d.item}</td><td>${d.type} ${d.qty}</td><td>${d.user}</td></tr>`;
  });
  historyTable.innerHTML=out;
});

</script>
</body>
</html>
