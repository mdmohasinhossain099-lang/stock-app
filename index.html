<!DOCTYPE html>
<html>
<head>
  <title>Stock Manager</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      text-align: center;
    }
    .box {
      background: white;
      padding: 20px;
      margin: 20px auto;
      width: 95%;
      max-width: 700px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      padding: 10px;
      margin: 5px;
      width: 90%;
      max-width: 200px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    table {
      width: 100%;
      margin-top: 10px;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }
    th {
      background: #007bff;
      color: white;
    }
  </style>
</head>

<body>

<div class="box" id="loginBox">
  <h2>🔐 Login</h2>
  <input id="username" placeholder="Username"><br>
  <input id="password" placeholder="4 digit password"><br>
  <button onclick="login()">Login</button>
</div>

<div class="box" id="app" style="display:none;">
  <h2>📦 Stock Manager</h2>

  <input id="item" placeholder="Parts name">
  <input id="qty" type="number" placeholder="Quantity">
  <input id="loc" placeholder="Location">
  <input id="quality" placeholder="Quality"><br>

  <button onclick="add()">➕ Add</button>
  <button onclick="minus()">➖ Minus</button>

  <h3>📊 Stock List</h3>
  <table id="stockTable"></table>

  <h3>📜 History</h3>
  <table id="historyTable"></table>

  <div id="adminPanel" style="display:none;">
    <h3>👑 Admin Panel</h3>

    <input id="newUser" placeholder="New Username">
    <input id="newPass" placeholder="4 digit password">
    <button onclick="addUser()">Add User</button><br>

    <input id="delUser" placeholder="Delete Username">
    <button onclick="deleteUser()">Delete User</button>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, collection,
  addDoc, onSnapshot, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGBmkM66osUUrIzt8KsgU7u9YiuHPLPPw",
  authDomain: "stockapp-3d9f9.firebaseapp.com",
  projectId: "stockapp-3d9f9",
  storageBucket: "stockapp-3d9f9.firebasestorage.app",
  messagingSenderId: "448917511917",
  appId: "1:448917511917:web:02ca98e7a805d44d57b6e4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = "";

// 🔐 LOGIN
window.login = async function(){
  let u = document.getElementById("username").value;
  let p = document.getElementById("password").value;

  const ref = doc(db, "users", u);
  const snap = await getDoc(ref);

  if(snap.exists() && snap.data().pass === p){
    currentUser = u;
    document.getElementById("loginBox").style.display="none";
    document.getElementById("app").style.display="block";

    if(u === "mohasin"){
      document.getElementById("adminPanel").style.display="block";
    }

  } else {
    alert("Wrong login!");
  }
};

// ➕ ADD
window.add = async function(){
  let item = document.getElementById("item").value;
  let safeItem = item.replaceAll("/", "_");

  let qty = parseInt(document.getElementById("qty").value);
  let loc = document.getElementById("loc").value;
  let quality = document.getElementById("quality").value;

  if(isNaN(qty)){
    alert("Quantity must be number!");
    return;
  }

  const ref = doc(db, "stock", safeItem);
  const snap = await getDoc(ref);

  let current = snap.exists() ? snap.data().qty : 0;

  await setDoc(ref, {
    name: item,
    qty: current + qty,
    loc,
    quality
  });

  await addDoc(collection(db, "history"), {
    item, qty, type:"add", user:currentUser
  });
};

// ➖ MINUS
window.minus = async function(){
  let item = document.getElementById("item").value;
  let safeItem = item.replaceAll("/", "_");

  let qty = parseInt(document.getElementById("qty").value);
  let loc = document.getElementById("loc").value;
  let quality = document.getElementById("quality").value;

  if(isNaN(qty)){
    alert("Quantity must be number!");
    return;
  }

  const ref = doc(db, "stock", safeItem);
  const snap = await getDoc(ref);

  let current = snap.exists() ? snap.data().qty : 0;

  await setDoc(ref, {
    name: item,
    qty: current - qty,
    loc,
    quality
  });

  await addDoc(collection(db, "history"), {
    item, qty, type:"minus", user:currentUser
  });
};

// 👑 ADMIN
window.addUser = async function(){
  let u = document.getElementById("newUser").value;
  let p = document.getElementById("newPass").value;

  if(p.length !== 4){
    alert("Password must be 4 digit!");
    return;
  }

  await setDoc(doc(db, "users", u), { pass:p });
  alert("User added!");
};

window.deleteUser = async function(){
  let u = document.getElementById("delUser").value;
  await deleteDoc(doc(db, "users", u));
  alert("User deleted!");
};

// 📊 STOCK VIEW
onSnapshot(collection(db, "stock"), (snapshot)=>{
  let out = `<tr><th>Parts</th><th>Qty</th><th>Location</th><th>Quality</th></tr>`;
  snapshot.forEach(doc=>{
    let d = doc.data();
    out += `<tr><td>${d.name}</td><td>${d.qty}</td><td>${d.loc}</td><td>${d.quality}</td></tr>`;
  });
  document.getElementById("stockTable").innerHTML = out;
});

// 📜 HISTORY VIEW
onSnapshot(collection(db, "history"), (snapshot)=>{
  let out = `<tr><th>Parts</th><th>Action</th><th>User</th></tr>`;
  snapshot.forEach(doc=>{
    let d = doc.data();
    out += `<tr><td>${d.item}</td><td>${d.type} ${d.qty}</td><td>${d.user}</td></tr>`;
  });
  document.getElementById("historyTable").innerHTML = out;
});

</script>

</body>
</html>
